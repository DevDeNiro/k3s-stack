# =============================================================================
# Prometheus for the local k3d cluster (local/install.sh --with-monitoring)
# Minimal footprint; the full VPS configuration lives in vps/values/prometheus.yaml.
# =============================================================================
server:
  resources:
    requests:
      memory: "128Mi"
    limits:
      memory: "512Mi"

# prometheus-config-reloader v0.95.1 (chart default) is published for amd64 only:
# multi-arch release for Apple Silicon workstations
configmapReload:
  prometheus:
    image:
      tag: v0.94.0
alertmanager:
  configmapReload:
    image:
      tag: v0.94.0
