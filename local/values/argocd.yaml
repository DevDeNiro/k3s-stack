# =============================================================================
# Argo CD Configuration for Local K3d Cluster
# Mirrors VPS configuration with low memory footprint
# =============================================================================

global:
    networkPolicy:
        create: false

server:
    resources:
      requests:
        memory: "128Mi"
        cpu: "50m"
      limits:
        memory: "256Mi"
        cpu: "200m"
    service:
      type: ClusterIP
    extraArgs:
      - --insecure

repoServer:
    resources:
      requests:
        memory: "128Mi"
        cpu: "50m"
      limits:
        memory: "256Mi"
        cpu: "200m"

controller:
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "500m"

redis:
    resources:
      requests:
        memory: "64Mi"
        cpu: "25m"
      limits:
        memory: "128Mi"
        cpu: "100m"

dex:
    enabled: false

notifications:
    enabled: false

applicationSet:
    enabled: true
    resources:
      requests:
        memory: "64Mi"
        cpu: "25m"
      limits:
        memory: "128Mi"
        cpu: "100m"

configs:
    cm:
        helm.enabled: "true"
        statusbadge.enabled: "true"
        timeout.reconciliation: "180s"
        application.resourceTrackingMethod: "annotation"
    rbac:
        policy.default: role:admin
    repositories: { }
