# =============================================================================
# NGINX Gateway Fabric Configuration for Local K3d Cluster
# Mirrors VPS configuration
# =============================================================================
nginxGateway:
  kind: deployment
  gatewayClassName: nginx
  gatewayControllerName: gateway.nginx.org/nginx-gateway-controller
  config:
    logging:
      level: info
  leaderElection:
    enable: false
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"
  replicas: 1

nginx:
  kind: deployment
  replicas: 1
  container:
    hostPorts:
      - port: 80
        containerPort: 80
      - port: 443
        containerPort: 443
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"
  service:
    type: ClusterIP
