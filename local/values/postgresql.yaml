# =============================================================================
# PostgreSQL Configuration for Local K3d Cluster
# Deployed in namespace: storage (matches VPS architecture)
# =============================================================================

architecture: standalone

auth:
  enablePostgresUser: true
  database: "coterie-webapp-local"
  username: "coterie-webapp-local"

primary:
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "384Mi"
      cpu: "500m"
  persistence:
    enabled: true
    size: "5Gi"

service:
  type: ClusterIP
  ports:
    postgresql: 5432

containerSecurityContext:
  enabled: true
  runAsUser: 1001
  runAsNonRoot: true
  allowPrivilegeEscalation: false

podSecurityContext:
  enabled: true
  fsGroup: 1001
