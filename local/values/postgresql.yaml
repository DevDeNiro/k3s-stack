# =============================================================================
# PostgreSQL on the local k3d cluster: differences with the VPS only.
# local/install.sh layers vps/values/postgresql.yaml (TLS, pg_hba, tuning),
# this file, then vps/values/postgresql-image.yaml.
# Superuser only, as on the VPS: local/deploy-app.sh creates the role and the
# database of each application.
# =============================================================================

primary:
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "384Mi"
      cpu: "500m"
  persistence:
    size: "5Gi"
