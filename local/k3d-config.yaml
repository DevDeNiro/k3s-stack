apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
    name: dev-cluster

servers: 1
agents: 0

kubeAPI:
    hostIP: "127.0.0.1"
    hostPort: "6443"

image: rancher/k3s:v1.29.0-k3s1

ports:
    # Ports for Gateway API (NGINX Gateway Fabric) via k3d LoadBalancer
    -   port: 80:80
        nodeFilters:
            - loadbalancer
    -   port: 443:443
        nodeFilters:
            - loadbalancer
    # Direct access NodePorts (optional local tools)
    -   port: 30432:30432
        nodeFilters:
            - server:0
    -   port: 30379:30379
        nodeFilters:
            - server:0

volumes:
    -   volume: k3d-dev-storage:/var/lib/rancher/k3s/storage
        nodeFilters:
            - server:0

options:
    k3d:
        wait: true
        timeout: "300s"
        disableLoadbalancer: false
        disableImageVolume: false
    k3s:
        extraArgs:
            -   arg: --disable=traefik
                nodeFilters:
                    - server:*
            -   arg: --disable=servicelb
                nodeFilters:
                    - server:*
            -   arg: --tls-san=127.0.0.1
                nodeFilters:
                    - server:*
            -   arg: --tls-san=localhost
                nodeFilters:
                    - server:*
    kubeconfig:
        updateDefaultKubeconfig: true
        switchCurrentContext: true
