# =============================================================================
# k3d cluster "dev-cluster" - local mirror of the VPS K3s server
# Same K3s flags as vps/config/k3s/config.yaml (audit log excepted). The image
# (rancher/k3s, K3S_VERSION of vps/config/versions.env) is passed by
# local/install.sh. Ports are published on 127.0.0.1 only.
# =============================================================================
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
    name: dev-cluster

servers: 1
agents: 0

kubeAPI:
    hostIP: "127.0.0.1"
    hostPort: "6443"

ports:
    # Gateway (NGINX Gateway Fabric hostPorts) through the k3d load balancer
    -   port: 127.0.0.1:80:80
        nodeFilters:
            - loadbalancer
    -   port: 127.0.0.1:443:443
        nodeFilters:
            - loadbalancer

volumes:
    -   volume: k3d-dev-storage:/var/lib/rancher/k3s/storage
        nodeFilters:
            - server:0

options:
    k3d:
        wait: true
        timeout: "300s"
        disableLoadbalancer: false
        disableImageVolume: false
    k3s:
        extraArgs:
            -   arg: --disable=traefik
                nodeFilters:
                    - server:*
            -   arg: --disable=servicelb
                nodeFilters:
                    - server:*
            -   arg: --secrets-encryption=true
                nodeFilters:
                    - server:*
            -   arg: --secrets-encryption-provider=secretbox
                nodeFilters:
                    - server:*
            -   arg: --tls-san=127.0.0.1
                nodeFilters:
                    - server:*
            -   arg: --tls-san=localhost
                nodeFilters:
                    - server:*
    kubeconfig:
        updateDefaultKubeconfig: true
        switchCurrentContext: true
