# =============================================================================
# Infrastructure Gateway (Local Mirror)
# Matches VPS name and namespace: infrastructure-gateway in nginx-gateway
# =============================================================================
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
    name: infrastructure-gateway
    namespace: nginx-gateway
    labels:
        app.kubernetes.io/name: infrastructure-gateway
        app.kubernetes.io/component: gateway
        app.kubernetes.io/managed-by: k3s-local
spec:
    gatewayClassName: nginx
    listeners:
        - name: http
          port: 80
          protocol: HTTP
          allowedRoutes:
              namespaces:
                  from: All
