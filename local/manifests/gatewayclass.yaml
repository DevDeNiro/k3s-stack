# =============================================================================
# GatewayClass for NGINX Gateway Fabric (Local Mirror)
# =============================================================================
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
    name: nginx
    labels:
        app.kubernetes.io/name: nginx-gateway-fabric
        app.kubernetes.io/component: gateway
        app.kubernetes.io/managed-by: k3s-local
spec:
    controllerName: gateway.nginx.org/nginx-gateway-controller
    description: "NGINX Gateway Fabric for local k3d cluster"
