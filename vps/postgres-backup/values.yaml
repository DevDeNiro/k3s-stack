# =============================================================================
# PostgreSQL Backup Configuration - Production Only
# =============================================================================
# Backs up ALL production databases (*-prod) + infrastructure (keycloak) to a
# PVC on the node, and optionally copies that volume to an encrypted restic
# repository off the server (offsite below, vps/docs/postgres-backup.md).
# Installed and upgraded by vps/scripts/apply-backups.sh.
# =============================================================================

# =============================================================================
# Backup Schedules
# =============================================================================
schedules:
    # Daily backup at 03:00 in the controller's timezone (retained 7 days)
    daily:
        enabled: true
        cron: "0 3 * * *"
        retentionDays: 7
    # Weekly backup on Sunday at 04:00 in the controller's timezone (retained 30 days)
    weekly:
        enabled: true
        cron: "0 4 * * 0"
        retentionDays: 30
    # Monthly backup on 1st at 05:00 in the controller's timezone (retained 365 days)
    monthly:
        enabled: true
        cron: "0 5 1 * *"
        retentionDays: 365

# =============================================================================
# PostgreSQL Connection
# =============================================================================
postgresql:
    host: postgresql.storage.svc.cluster.local
    port: 5432
    # Admin user for pg_dumpall / listing databases
    adminUser: postgres
    existingSecret: postgresql-secret
    secretKey: postgres-password

# =============================================================================
# Databases to Backup
# =============================================================================
# "auto" = automatically discover all *-prod databases + keycloak
# Or specify a list explicitly
databases: auto
# databases:
#   - keycloak
#   - another-app-prod

# Always include these infrastructure databases
infrastructureDatabases:
    - keycloak

# =============================================================================
# Local Storage
# =============================================================================
localStorage:
    enabled: true
    storageSize: 20Gi
    storageClass: ""
    mountPath: /backups

# =============================================================================
# Container Configuration
# =============================================================================
# vps/install.sh adds vps/values/postgresql-image.yaml (registry, repository,
# digest): the dumps are made with the exact image of the server.
image:
    registry: docker.io
    repository: bitnami/postgresql
    tag: "latest"
    digest: ""
    pullPolicy: IfNotPresent

resources:
    requests:
        memory: "128Mi"
        cpu: "100m"
    limits:
        memory: "256Mi"
        cpu: "500m"

# =============================================================================
# Off-site Copy (restic), optional
# =============================================================================
# The CronJob <release>-offsite copies the dump volume to an encrypted restic
# repository on an S3-compatible object storage, then applies the retention below
# (restic forget --prune). It does not wait for dump jobs to finish. The CronJob
# <release>-offsite-check verifies the repository every week. A failed job
# raises the KubeJobFailed alert.
# vps/scripts/apply-backups.sh enables it when OFFSITE_BACKUP_REPOSITORY is set
# in vps/config.env (vps/templates/postgres-backup/offsite-values.yaml.tpl).
offsite:
    enabled: false
    # restic repository: s3:https://<endpoint>/<bucket>/<path>
    repository: ""
    # Region signing the S3 requests (AWS_DEFAULT_REGION); empty: restic default
    region: ""
    # Secret holding AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY and RESTIC_PASSWORD
    # (vps/scripts/setup-secrets.sh set-offsite-backup)
    existingSecret: postgres-backup-offsite
    # Host recorded in the snapshots: constant, so that the retention groups the
    # snapshots of every job pod
    snapshotHost: postgres-backup
    backup:
        # Scheduled after the dump jobs, without waiting for their completion
        cron: "30 5 * * *"
        # restic forget --prune: snapshots kept
        keepDaily: 7
        keepWeekly: 4
        keepMonthly: 12
    check:
        # Sunday 06:30 in the controller's timezone
        cron: "30 6 * * 0"
        # Share of the data downloaded and verified at each check; "": structure only
        readDataSubset: "10%"
    # A stuck job (network) is stopped, fails and alerts
    activeDeadlineSeconds: 7200
    image:
        registry: docker.io
        repository: restic/restic
        # RESTIC_VERSION of vps/config/versions.env, set by apply-backups.sh
        tag: ""
        pullPolicy: IfNotPresent
    resources:
        requests:
            memory: "64Mi"
            cpu: "50m"
        limits:
            memory: "512Mi"
            cpu: "500m"
