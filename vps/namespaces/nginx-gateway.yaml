# =============================================================================
# NGINX Gateway Fabric Namespace
# Gateway API controller for ingress traffic (replacement for ingress-nginx)
# =============================================================================

---
apiVersion: v1
kind: Namespace
metadata:
    name: nginx-gateway
    labels:
        app.kubernetes.io/name: nginx-gateway
        app.kubernetes.io/component: gateway
        app.kubernetes.io/managed-by: k3s-vps
        # PSA: privileged enforcement, the NGINX data plane publishes hostPorts 80/443
        # (refused by baseline). Audit and warnings keep reporting what exceeds baseline.
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/audit: baseline
        pod-security.kubernetes.io/warn: baseline
