# =============================================================================
# Historical Promtail values retained as the source for the Alloy migration.
# Promtail is end-of-life and is no longer installed by vps/install.sh.
# Runs on every node (only one node in the VPS deployment).
# =============================================================================

# Resource budget kept very small - the chart default is OK for a single node
resources:
  requests:
    memory: "64Mi"
    cpu: "25m"
  limits:
    memory: "128Mi"
    cpu: "100m"

# Send logs to Loki SingleBinary
config:
  clients:
    - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push
      # tenant_id only needed if auth_enabled=true on Loki
      backoff_config:
        min_period: 500ms
        max_period: 5m
        max_retries: 10

  snippets:
    pipelineStages:
      # Standard: docker/containerd already produces JSON-formatted lines, but
      # k3s containerd writes plain text logs - keep both stages for safety.
      - cri: {}
      - docker: {}
      # Secrets carried by URLs never reach Loki, whatever the pod that logs them
      # (vps/docs/security-hardening.md): the token of the /stop/<token> paths
      # (opt-out links) and the OAuth/OIDC values of query strings. Each capture
      # group is replaced, on every match of the line.
      - replace:
          expression: '/stop/([^\s?"#]+)'
          replace: '<redacted>'
      - replace:
          expression: '[?&](?:code|state|session_state|id_token_hint)=([^&\s"#]+)'
          replace: '<redacted>'
      # Drop noisy kube-system probes from logs
      - match:
          selector: '{namespace="kube-system",container=~"local-path-provisioner|metrics-server"}'
          action: drop
          drop_counter_reason: noisy_system

# Only run on linux/amd64 nodes
nodeSelector:
  kubernetes.io/os: linux

tolerations:
  - effect: NoSchedule
    operator: Exists
  - effect: NoExecute
    operator: Exists

# Pod labels for prometheus auto-discovery (optional)
podLabels:
  app: promtail
  component: log-collector

# Service monitor disabled (we expose /metrics via existing scrape annotations)
serviceMonitor:
  enabled: false
