# =============================================================================
# PostgreSQL Minimal Configuration for VPS (4-6GB RAM)
# Optimized for low memory footprint with production-grade features
# =============================================================================

# Use standalone mode (no replication)
architecture: standalone

# Superuser only: each application gets its own role and database (scripts/onboard-app.sh)
auth:
  enablePostgresUser: true
  # Password managed via Kubernetes Secret (created by scripts/setup-secrets.sh)
  existingSecret: postgresql-secret
  secretKeys:
    adminPasswordKey: postgres-password

# In-cluster encryption with a self-signed certificate generated by the chart.
# TLS is offered, not required: clients opt in with sslmode=require (URLs of
# the Secrets created by scripts/onboard-app.sh).
tls:
  enabled: true
  autoGenerated: true
  preferServerCiphers: true

# Primary PostgreSQL configuration
primary:
  # Resource limits optimized for 4GB VPS
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "384Mi"
      cpu: "500m"

  persistence:
    enabled: true
    size: "10Gi"
    storageClass: ""
    accessModes:
      - ReadWriteOnce

  # Extended PostgreSQL configuration (ADDED to default config, not replacing)
  # NOTE: Do NOT use 'configuration' - it replaces the entire config and breaks TLS
  extendedConfiguration: |
    # ===========================================
    # Memory Configuration (optimized for 384MB limit)
    # ===========================================
    shared_buffers = 96MB
    effective_cache_size = 192MB
    work_mem = 4MB
    maintenance_work_mem = 32MB
    max_connections = 50
    
    # ===========================================
    # pg_stat_statements (slow query monitoring)
    # ===========================================
    shared_preload_libraries = 'pg_stat_statements'
    pg_stat_statements.track = all
    pg_stat_statements.max = 5000
    pg_stat_statements.track_utility = on
    pg_stat_statements.track_planning = on
    
    # ===========================================
    # Logging (slow queries > 500ms)
    # ===========================================
    log_min_duration_statement = 500
    log_statement = 'ddl'
    log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
    log_checkpoints = on
    log_lock_waits = on
    log_temp_files = 0
    
    # ===========================================
    # Performance Tuning
    # ===========================================
    random_page_cost = 1.1
    effective_io_concurrency = 200
    checkpoint_completion_target = 0.9
    
    # ===========================================
    # Autovacuum (conservative for low memory)
    # ===========================================
    autovacuum_max_workers = 2
    autovacuum_naptime = 60s

    # ===========================================
    # TLS key exchange groups (PostgreSQL 18)
    # ===========================================
    # The default "X25519:prime256v1" matches no group of the OpenSSL build of
    # the Bitnami image (openssl list -tls-groups): the server would refuse to
    # start with TLS enabled.
    ssl_groups = 'X25519MLKEM768:secp256r1:secp384r1'

  # Password authentication (SCRAM) for every connection, with or without TLS.
  # Without this file the image requires a client certificate on TLS
  # connections ("hostssl ... cert"): clients silently fall back to plaintext.
  # Every role is created with a SCRAM password (the backups hold no roles).
  pgHbaConfiguration: |
    local all all scram-sha-256
    host  all all 127.0.0.1/32 scram-sha-256
    host  all all ::1/128 scram-sha-256
    host  all all 0.0.0.0/0 scram-sha-256
    host  all all ::/0 scram-sha-256

  # Init scripts to setup pg_stat_statements extension
  initdb:
    scripts:
      init-extensions.sql: |
        CREATE EXTENSION IF NOT EXISTS pg_stat_statements;

  # The chart NetworkPolicy allows port 5432 from every pod of every namespace
  # and, NetworkPolicies being additive, would void vps/manifests/network-policies.yaml
  networkPolicy:
    enabled: false

# Metrics and monitoring
metrics:
  enabled: true
  resources:
    requests:
      memory: "32Mi"
      cpu: "25m"
    limits:
      memory: "64Mi"
      cpu: "100m"
  service:
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9187"
  serviceMonitor:
    enabled: false

# Security contexts and probes: chart defaults (primary.*), already non-root,
# read-only root filesystem, no privilege escalation, capabilities dropped
