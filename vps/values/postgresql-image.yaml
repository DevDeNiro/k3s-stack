# =============================================================================
# PostgreSQL image shared by the server (bitnami/postgresql chart, VPS and
# local mirror) and the backup CronJobs (vps/postgres-backup): pg_dump always
# matches the server.
#
# Bitnami publishes its free images under the "latest" tag only. The digest
# pins the tested release, so a node re-pulling the image never jumps to a new
# major version that could not open the existing data directory.
#   Pinned: PostgreSQL 18.6 (multi-arch index, linux/amd64 and linux/arm64)
#   Next digest: docker buildx imagetools inspect docker.io/bitnami/postgresql:latest
# A new major version needs a dump and a restore (vps/docs/postgres-backup.md).
# =============================================================================
image:
  registry: docker.io
  repository: bitnami/postgresql
  digest: "sha256:b418fd5f001c272aad93ac1febf783f543ee45d8e359d58bd5afc3d2a9b62290"
