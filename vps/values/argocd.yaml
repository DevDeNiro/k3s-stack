# =============================================================================
# Argo CD Minimal Configuration for VPS (4-6GB RAM)
# Optimized for low memory footprint
# =============================================================================

# Global configuration
global:
    # Disable network policies (handled separately if needed)
    networkPolicy:
        create: false

# Argo CD Server
server:
    # Resource limits (minimal for VPS)
    resources:
        requests:
            memory: "128Mi"
            cpu: "50m"
        limits:
            memory: "256Mi"
            cpu: "200m"

    # Not exposed: kubectl port-forward -n argocd svc/argocd-server 8080:80 (http://localhost:8080)
    service:
        type: ClusterIP

    # Plain HTTP inside the cluster (reached through port-forward only)
    extraArgs:
        - --insecure

# Argo CD Repo Server
repoServer:
    resources:
        requests:
            memory: "128Mi"
            cpu: "50m"
        limits:
            memory: "256Mi"
            cpu: "200m"

# Argo CD Application Controller
controller:
    resources:
        requests:
            memory: "256Mi"
            cpu: "100m"
        limits:
            memory: "512Mi"
            cpu: "500m"

# Redis (used by Argo CD for caching)
redis:
    resources:
        requests:
            memory: "64Mi"
            cpu: "25m"
        limits:
            memory: "128Mi"
            cpu: "100m"

# Dex (SSO - disabled to save resources, can enable later)
dex:
    enabled: false

# Notifications controller (disabled to save resources)
notifications:
    enabled: false

# ApplicationSet controller (required for auto-discovery)
applicationSet:
    resources:
        requests:
            memory: "64Mi"
            cpu: "25m"
        limits:
            memory: "128Mi"
            cpu: "100m"

# Configs
configs:
    # Argo CD ConfigMap
    cm:
        # Status badge
        statusbadge.enabled: "true"
        # Application resync period (default 3m, increase to reduce load)
        timeout.reconciliation: "180s"
        # Resource tracking method
        application.resourceTrackingMethod: "annotation"

    # Argo CD RBAC configuration
    rbac:
        # Default policy for authenticated users
        policy.default: role:readonly
        # Admin policy (configure specific users/groups as needed)
        policy.csv: |
            g, admin, role:admin

    # Repository credentials (configured via secrets)
    repositories: { }

    # SSH known hosts: chart defaults (GitHub, GitLab, Bitbucket...); repositories use HTTPS

    # Argo CD secret (admin password managed via setup-secrets.sh)
    secret:
        createSecret: false  # We create it manually with setup-secrets.sh
