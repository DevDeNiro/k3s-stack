# =============================================================================
# SSH server hardening
# Installed by vps/scripts/harden-host.sh --harden-ssh into /etc/ssh/sshd_config.d/.
# sshd keeps the first value it reads for each keyword: this file sorts before
# the distribution defaults (50-cloud-init.conf...), so its values win.
# TCP forwarding stays enabled: kubectl reaches the API through an SSH tunnel.
# =============================================================================
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
MaxAuthTries 3
X11Forwarding no
